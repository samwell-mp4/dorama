[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "pip install --no-cache-dir -r reelshort-api/requirements.txt",
  "npm ci",
  "cd reelshort-web && npm install"
]

[phases.build]
cmds = [
  "cd reelshort-web && npm run build"
]

[start]
cmd = "node server.js"
