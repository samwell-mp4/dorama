[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "python3 -m venv /app/.venv",
  "/app/.venv/bin/pip install --no-cache-dir -r reelshort-api/requirements.txt",
  "npm ci --omit=dev"
]

[phases.build]
cmds = []

[variables]
PATH = "/app/.venv/bin:/app/node_modules/.bin:$PATH"

[start]
cmd = "node server.js"
